<svg width="454" height="48" viewBox="0 0 454 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#111114"/>
    </linearGradient>

    <!-- Border Glow Animation Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Shimmer Light Sweep -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .icon-card {
      transition: transform 0.3s ease, filter 0.3s ease;
      cursor: pointer;
    }
    .icon-card:hover {
      transform: translateY(-2px);
      filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.6));
    }
    @keyframes pulseCard {
      0%, 100% { stroke-opacity: 0.3; }
      50% { stroke-opacity: 0.8; }
    }
    .card-border {
      animation: pulseCard 3s ease-in-out infinite;
    }
    @keyframes shimmerAnim {
      0% { transform: translateX(-454px); }
      100% { transform: translateX(454px); }
    }
    .shimmer-bar {
      animation: shimmerAnim 6s ease-in-out infinite;
    }
  </style>

  <!-- ==================== 1. POWER BI (x=0) ==================== -->
  <g class="icon-card" transform="translate(0, 0)">
    <rect width="48" height="48" rx="10" fill="url(#cardBg)" stroke="#27272a" stroke-width="1.2" class="card-border"/>
    <!-- Yellow Power BI Bars -->
    <g transform="translate(9, 9)">
      <!-- Left bar -->
      <rect x="2" y="16" width="6" height="12" rx="2" fill="#ECA200"/>
      <!-- Middle bar -->
      <rect x="11" y="9" width="6" height="19" rx="2" fill="#F2C811"/>
      <!-- Right bar -->
      <rect x="20" y="2" width="6" height="26" rx="2" fill="#FCE778"/>
    </g>
    <title>Microsoft Power BI</title>
  </g>

  <!-- ==================== 2. TABLEAU (x=58) ==================== -->
  <g class="icon-card" transform="translate(58, 0)">
    <rect width="48" height="48" rx="10" fill="url(#cardBg)" stroke="#27272a" stroke-width="1.2" class="card-border"/>
    <!-- Tableau Iconic Cross Cluster -->
    <g transform="translate(11, 11)">
      <!-- Center Main Plus (Dark Navy) -->
      <path d="M12 7h2v12h-2zM7 12h12v2H7z" fill="#1F4570"/>
      <!-- Top Plus (Orange) -->
      <path d="M12.3 0h1.4v6h-1.4zM10 2.3h6v1.4h-6z" fill="#E8762D"/>
      <!-- Right Plus (Teal) -->
      <path d="M22 10.3h1.4v6H22zM19.7 12.6h6v1.4h-6z" fill="#278B92"/>
      <!-- Bottom Plus (Teal Navy) -->
      <path d="M12.3 20h1.4v6h-1.4zM10 22.3h6v1.4h-6z" fill="#5A8D9B"/>
      <!-- Left Plus (Coral/Red) -->
      <path d="M2.3 10.3h1.4v6H2.3zM0 12.6h6v1.4H0z" fill="#C72037"/>
      <!-- Diagonal Mini Plus Top-Right -->
      <path d="M19 4h1v3h-1zM18 5h3v1h-3z" fill="#E8762D"/>
      <!-- Diagonal Mini Plus Bottom-Right -->
      <path d="M19 19h1v3h-1zM18 20h3v1h-3z" fill="#1F4570"/>
      <!-- Diagonal Mini Plus Bottom-Left -->
      <path d="M4 19h1v3H4zM3 20h3v1H3z" fill="#E8762D"/>
      <!-- Diagonal Mini Plus Top-Left -->
      <path d="M4 4h1v3H4zM3 5h3v1H3z" fill="#5A8D9B"/>
    </g>
    <title>Tableau Desktop &amp; Server</title>
  </g>

  <!-- ==================== 3. JUPYTER (x=116) ==================== -->
  <g class="icon-card" transform="translate(116, 0)">
    <rect width="48" height="48" rx="10" fill="url(#cardBg)" stroke="#27272a" stroke-width="1.2" class="card-border"/>
    <!-- Jupyter Crescent & Dots -->
    <g transform="translate(9, 9)">
      <!-- Top Crescent Arc -->
      <path d="M15 4C8.5 4 3.2 8.3 1.5 14.2c1.7-1.3 4.1-2.2 7-2.2 6.1 0 11.2 3.8 12.5 9 1.4-1.8 2.3-4.1 2.3-6.6 0-5.7-3.7-10.4-8.3-10.4z" fill="#F37626"/>
      <!-- Bottom Crescent Arc -->
      <path d="M15 26c6.5 0 11.8-4.3 13.5-10.2-1.7 1.3-4.1 2.2-7 2.2-6.1 0-11.2-3.8-12.5-9-1.4 1.8-2.3 4.1-2.3 6.6 0 5.7 3.7 10.4 8.3 10.4z" fill="#F37626"/>
      <!-- Top Satellite Dot -->
      <circle cx="21" cy="5" r="2.2" fill="#767676"/>
      <!-- Center Satellite Dot -->
      <circle cx="8" cy="22" r="2.2" fill="#767676"/>
      <!-- Small Satellite Dot -->
      <circle cx="6" cy="18.5" r="1.3" fill="#9E9E9E"/>
    </g>
    <title>Jupyter Notebooks / Lab</title>
  </g>

  <!-- ==================== 4. STREAMLIT (x=174) ==================== -->
  <g class="icon-card" transform="translate(174, 0)">
    <rect width="48" height="48" rx="10" fill="url(#cardBg)" stroke="#27272a" stroke-width="1.2" class="card-border"/>
    <!-- Streamlit Geometric Crown -->
    <g transform="translate(10, 13)">
      <!-- Left Triangle (Coral Red) -->
      <polygon points="14,0 28,22 14,22" fill="#FF4B4B"/>
      <!-- Middle Triangle (Darker Pink/Red) -->
      <polygon points="14,0 14,22 4,22" fill="#FF2B2B"/>
      <!-- Far Left Triangle (Light Salmon Pink) -->
      <polygon points="4,11 14,22 0,22" fill="#FF8A8A"/>
    </g>
    <title>Streamlit Data Apps</title>
  </g>

  <!-- ==================== 5. EXCEL (x=232) ==================== -->
  <g class="icon-card" transform="translate(232, 0)">
    <rect width="48" height="48" rx="10" fill="url(#cardBg)" stroke="#27272a" stroke-width="1.2" class="card-border"/>
    <!-- Excel Workbook Icon -->
    <g transform="translate(9, 9)">
      <!-- Spreadsheet Grid Backing -->
      <rect x="8" y="3" width="19" height="24" rx="2.5" fill="#107C41"/>
      <rect x="13" y="7" width="10" height="3" rx="0.5" fill="#23A55A" opacity="0.8"/>
      <rect x="13" y="12" width="10" height="3" rx="0.5" fill="#23A55A" opacity="0.8"/>
      <rect x="13" y="17" width="10" height="3" rx="0.5" fill="#23A55A" opacity="0.8"/>
      <!-- Front "X" Tile -->
      <rect x="2" y="7" width="15" height="16" rx="2.5" fill="#0E5E31" stroke="#23A55A" stroke-width="0.8"/>
      <text x="9.5" y="19" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">X</text>
    </g>
    <title>Microsoft Excel Advanced Analytics</title>
  </g>

  <!-- ==================== 6. MYSQL (x=290) ==================== -->
  <g class="icon-card" transform="translate(290, 0)">
    <rect width="48" height="48" rx="10" fill="url(#cardBg)" stroke="#27272a" stroke-width="1.2" class="card-border"/>
    <!-- MySQL Dolphin Silhouette -->
    <g transform="translate(8, 8)">
      <path d="M26.2 16.5c-.8-1.5-2.2-3.3-4.5-4.4-.7-.4-1.7-.8-2.6-1-1.3-.3-2.5-.2-3.8.3-.4.2-1.3.8-1.6 1.1-.3.2-.8.8-1 1.1-.4.5-.6.8-1 1.4-.8 1.1-1.3 2.1-1.7 3.3-.4 1.1-.5 2.1-.5 3.3 0 1.2.3 2.4.8 3.5.6 1.2 1.5 2.2 2.6 3 1.1.8 2.4 1.2 3.8 1.3 1.4.1 2.8-.2 4-1 .8-.5 1.5-1.2 2-2 .5-.7.9-1.6 1.1-2.5.3-1.1.3-2.2.1-3.3-.1-.9-.5-1.8-1-2.6-.2-.3-.5-.7-.7-1 .3-.2.8-.4 1.2-.5.5-.1 1-.1 1.5 0 .7.2 1.4.6 2 1.1.2.2.5.5.7.8.2-.5.3-1.1.3-1.6 0-.2 0-.4-.1-.6z" fill="#00758F"/>
      <!-- Orange Tail Fin Wave -->
      <path d="M7 23.5c.3-1 .9-2 1.7-2.8.8-.8 1.8-1.4 2.9-1.7 1.1-.3 2.3-.3 3.4 0 .5.1 1.1.4 1.6.7-.4.6-.9 1.1-1.5 1.5-.7.5-1.5.8-2.4 1-.9.2-1.8.1-2.7-.2-.6-.2-1.2-.6-1.7-1-.3.8-.7 1.6-1.3 2.5z" fill="#F29111"/>
    </g>
    <title>MySQL Relational Database</title>
  </g>

  <!-- ==================== 7. BIGQUERY (x=348) ==================== -->
  <g class="icon-card" transform="translate(348, 0)">
    <rect width="48" height="48" rx="10" fill="url(#cardBg)" stroke="#27272a" stroke-width="1.2" class="card-border"/>
    <!-- Google BigQuery Icon -->
    <g transform="translate(9, 9)">
      <!-- Hexagonal Cloud Base -->
      <polygon points="15,2 27,9 27,21 15,28 3,21 3,9" fill="none" stroke="#669DF6" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- Internal Database Layer Grid -->
      <path d="M8 12c0-1.8 3.1-3 7-3s7 1.2 7 3-3.1 3-7 3-7-1.2-7-3z" fill="#4285F4" opacity="0.7"/>
      <path d="M8 16c0 1.8 3.1 3 7 3s7-1.2 7-3" fill="none" stroke="#4285F4" stroke-width="1.5"/>
      <path d="M8 20c0 1.8 3.1 3 7 3s7-1.2 7-3" fill="none" stroke="#669DF6" stroke-width="1.5"/>
      <!-- Search Magnifier Node -->
      <circle cx="21" cy="21" r="4.5" fill="#1A73E8" stroke="#ffffff" stroke-width="1"/>
      <line x1="24.5" y1="24.5" x2="28" y2="28" stroke="#1A73E8" stroke-width="2" stroke-linecap="round"/>
    </g>
    <title>Google BigQuery Enterprise Data Warehouse</title>
  </g>

  <!-- ==================== 8. PYSPARK (x=406) ==================== -->
  <g class="icon-card" transform="translate(406, 0)">
    <rect width="48" height="48" rx="10" fill="url(#cardBg)" stroke="#27272a" stroke-width="1.2" class="card-border"/>
    <!-- Apache Spark Flame / Burst -->
    <g transform="translate(9, 9)">
      <!-- Spark Explosive Petals -->
      <path d="M15 1c-.8 4.2-2.8 7.5-5.5 9.5-2.7 2-6.2 2.8-9.5 2 3.8 2.2 6.8 5.2 8.2 8.8 1.4 3.6 1.3 7.8 0 11.7 3.5-3.2 5.8-7.5 6.8-12 1-4.5.3-9.2-1.5-13.3.6 1.2 1.5 2.2 2.6 3 1.2.8 2.6 1.3 4 1.4-1.2-1.5-2-3.3-2.3-5.2-.3-1.9-.1-3.8.7-5.5-1.2.6-2.5 1-3.8 1.1s-2.6-.2-3.8-.8c1.5-1 2.7-2.4 3.4-4 .7-1.7.9-3.5.5-5.3-.9 1.1-2 2-3.2 2.7-1.3.7-2.7 1.1-4.2 1.2z" fill="#E25A1C"/>
      <path d="M17 12c-1.5 2.5-3.8 4.3-6.5 5.2 2.5 1 4.5 2.8 5.6 5.2.8-2.6.5-5.5-.9-7.8.8.8 1.8 1.3 2.9 1.4-.8-1.1-1.3-2.4-1.3-3.7.1-.1.2-.2.2-.3z" fill="#F27429"/>
      <!-- Python Mini Accent Indicator -->
      <circle cx="24" cy="24" r="2.5" fill="#38BDF8"/>
    </g>
    <title>Apache PySpark Distributed Computing</title>
  </g>

  <!-- Shimmer Sweep Line across all cards -->
  <rect x="0" y="0" width="80" height="48" fill="url(#shimmer)" class="shimmer-bar" pointer-events="none"/>
</svg>
