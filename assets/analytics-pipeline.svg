<svg width="900" height="175" viewBox="0 0 900 175" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#090e1c"/>
    </linearGradient>

    <!-- Node Gradient 1: Ingestion -->
    <linearGradient id="nodeIngest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Pipeline Wire Gradient -->
    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="glowPipe" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes flowPacket {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes nodePulse {
      0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 4px rgba(34, 211, 238, 0.4)); }
      50% { opacity: 1; filter: drop-shadow(0 0 12px rgba(34, 211, 238, 0.9)); }
    }
    @keyframes amberPulse {
      0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 4px rgba(245, 158, 11, 0.4)); }
      50% { opacity: 1; filter: drop-shadow(0 0 12px rgba(245, 158, 11, 0.9)); }
    }
    .flow-wire {
      stroke-dasharray: 8, 14;
      animation: flowPacket 2.5s linear infinite;
    }
    .cyan-node {
      animation: nodePulse 3s ease-in-out infinite;
    }
    .amber-node {
      animation: amberPulse 3s ease-in-out infinite 1.5s;
    }
  </style>

  <!-- Frame & Base -->
  <rect width="900" height="175" rx="12" fill="url(#pipeBg)" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Top Title Tag -->
  <g transform="translate(450, 24)">
    <rect x="-175" y="-12" width="350" height="24" rx="12" fill="#0c1322" stroke="#22d3ee" stroke-width="0.8"/>
    <circle cx="-150" cy="0" r="3" fill="#22d3ee" class="cyan-node"/>
    <circle cx="150" cy="0" r="3" fill="#f59e0b" class="amber-node"/>
    <text x="0" y="4" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">
      END-TO-END DATA ANALYTICS &amp; BI ARCHITECTURE
    </text>
  </g>

  <!-- Connecting Pipeline Wires with Animated Energy Flow -->
  <!-- Wire 1: Sources -> Warehouse -->
  <path d="M 195 95 L 260 95" stroke="#22d3ee" stroke-width="2.5" class="flow-wire" filter="url(#glowPipe)"/>
  <!-- Wire 2: Warehouse -> Compute -->
  <path d="M 415 95 L 480 95" stroke="#38bdf8" stroke-width="2.5" class="flow-wire" filter="url(#glowPipe)"/>
  <!-- Wire 3: Compute -> BI Presentation -->
  <path d="M 635 95 L 700 95" stroke="#f59e0b" stroke-width="2.5" class="flow-wire" filter="url(#glowPipe)"/>

  <!-- ================= STAGE 1: INGESTION (x=45 to 195) ================= -->
  <g transform="translate(45, 52)">
    <rect width="150" height="92" rx="10" fill="url(#nodeIngest)" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.6"/>
    <rect x="0" y="0" width="150" height="22" rx="10" fill="#0f172a"/>
    <text x="75" y="15" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="800" fill="#22d3ee" letter-spacing="1">1. DATA INGESTION</text>
    
    <text x="14" y="42" font-family="'Segoe UI', monospace" font-size="11" font-weight="600" fill="#e2e8f0">📂 Excel Sheets</text>
    <text x="14" y="62" font-family="'Segoe UI', monospace" font-size="11" font-weight="600" fill="#e2e8f0">🐬 MySQL DB</text>
    <text x="14" y="82" font-family="'Segoe UI', monospace" font-size="11" font-weight="600" fill="#94a3b8">⚡ REST &amp; Webhook</text>
  </g>

  <!-- ================= STAGE 2: LAKEHOUSE / WAREHOUSE (x=260 to 415) ================= -->
  <g transform="translate(260, 52)">
    <rect width="155" height="92" rx="10" fill="url(#nodeIngest)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.8"/>
    <rect x="0" y="0" width="155" height="22" rx="10" fill="#0f172a"/>
    <text x="77.5" y="15" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="800" fill="#38bdf8" letter-spacing="1">2. CLOUD WAREHOUSE</text>
    
    <text x="14" y="42" font-family="'Segoe UI', monospace" font-size="11" font-weight="600" fill="#e2e8f0">☁️ Google BigQuery</text>
    <text x="14" y="62" font-family="'Segoe UI', monospace" font-size="11" font-weight="600" fill="#e2e8f0">🔍 Partitioned SQL</text>
    <text x="14" y="82" font-family="'Segoe UI', monospace" font-size="11" font-weight="600" fill="#94a3b8">📦 Star / Snowflake</text>
  </g>

  <!-- ================= STAGE 3: DISTRIBUTED COMPUTE (x=480 to 635) ================= -->
  <g transform="translate(480, 52)">
    <rect width="155" height="92" rx="10" fill="url(#nodeIngest)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.8"/>
    <rect x="0" y="0" width="155" height="22" rx="10" fill="#0f172a"/>
    <text x="77.5" y="15" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="800" fill="#f59e0b" letter-spacing="1">3. COMPUTE &amp; ML</text>
    
    <text x="14" y="42" font-family="'Segoe UI', monospace" font-size="11" font-weight="600" fill="#e2e8f0">🔥 Apache PySpark</text>
    <text x="14" y="62" font-family="'Segoe UI', monospace" font-size="11" font-weight="600" fill="#e2e8f0">🪐 Jupyter Lab</text>
    <text x="14" y="82" font-family="'Segoe UI', monospace" font-size="11" font-weight="600" fill="#94a3b8">⚙️ Automated ETL</text>
  </g>

  <!-- ================= STAGE 4: BI & APPS (x=700 to 855) ================= -->
  <g transform="translate(700, 52)">
    <rect width="155" height="92" rx="10" fill="url(#nodeIngest)" stroke="#10b981" stroke-width="1" stroke-opacity="0.8"/>
    <rect x="0" y="0" width="155" height="22" rx="10" fill="#0f172a"/>
    <text x="77.5" y="15" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="800" fill="#10b981" letter-spacing="1">4. BI &amp; APPS</text>
    
    <text x="14" y="42" font-family="'Segoe UI', monospace" font-size="11" font-weight="600" fill="#e2e8f0">📊 Power BI</text>
    <text x="14" y="62" font-family="'Segoe UI', monospace" font-size="11" font-weight="600" fill="#e2e8f0">📈 Tableau</text>
    <text x="14" y="82" font-family="'Segoe UI', monospace" font-size="11" font-weight="600" fill="#e2e8f0">🚀 Streamlit Apps</text>
  </g>
</svg>
